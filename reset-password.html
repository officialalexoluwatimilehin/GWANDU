<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GWANDU | Reset Password</title>

    <link rel="stylesheet" href="css/reset-password.css">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <main class="reset-container">

        <div class="reset-card">

            <a href="login.html" class="logo">
                <span>↗</span> GWANDU
            </a>

            <div class="reset-header">

                <h1>Create New Password</h1>

                <p>
                    Enter a new password for your GWANDU account.
                    Make sure it is strong and secure.
                </p>

            </div>

            <div class="input-group">

                <label for="password">
                    New Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your new password"
                        autocomplete="new-password">

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()"
                        aria-label="Show password">

                        <i class="fa-regular fa-eye"></i>

                    </button>

                </div>

            </div>

            <button
                id="resetBtn"
                class="reset-btn">

                <span>Reset Password</span>

                <i class="fa-solid fa-arrow-right"></i>

            </button>

            <p id="message"></p>

            <a
                href="login.html"
                class="back-login">

                <i class="fa-solid fa-arrow-left"></i>
                Back to Login

            </a>

            <div class="security-note">

                <i class="fa-solid fa-shield-halved"></i>

                Your password is securely protected by GWANDU.

            </div>

        </div>

    </main>

    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const icon =
                document.querySelector(".password-toggle i");

            if (password.type === "password") {

                password.type = "text";

                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");

            } else {

                password.type = "password";

                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");

            }

        }

    </script>

    <script src="js/config.js"></script>
    <script src="js/reset-password.js"></script>

</body>

</html>
